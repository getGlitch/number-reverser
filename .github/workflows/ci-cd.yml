name: Number Reverser CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check app/

      - name: Unit tests
        run: pytest -q

  security:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t number-reverser:${{ github.sha }} \
            .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.4

      - name: Scan Docker image
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            number-reverser:${{ github.sha }}
