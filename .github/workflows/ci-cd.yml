name: Number Reverser CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read


# ============================================================
# 1. APPLICATION TESTS
# ============================================================

jobs:

  test:
    name: 1. Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest ruff

      - name: Lint
        run: |
          ruff check app/

      - name: Unit tests
        run: |
          pytest -q


# ============================================================
# 2. TERRAFORM SECURITY SCAN
# ============================================================

  terraform-security:
    name: 2. Terraform Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Checkov
        run: |
          pip install checkov
          checkov --version

      - name: Terraform security scan
        working-directory: terraform
        run: |
          checkov \
            -d . \
            --framework terraform \
            --download-external-modules true


# ============================================================
# 3. TERRAFORM VALIDATION
# ============================================================

  terraform-validate:
    name: 3. Terraform Format and Validate
    runs-on: ubuntu-latest
    needs: terraform-security

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598907064200:role/GitHubActions-NumberReverser
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform version
        run: |
          terraform version

      - name: Terraform init
        run: |
          terraform init -input=false

      - name: Terraform format check
        run: |
          terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          terraform validate


# ============================================================
# 4. TERRAFORM PLAN
# ============================================================

  terraform-plan:
    name: 4. Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598907064200:role/GitHubActions-NumberReverser
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform init -input=false

      - name: Terraform plan
        run: |
          terraform plan -input=false


# ============================================================
# 5. TERRAFORM APPLY
# Only runs after merge/push to main
# ============================================================

  terraform-apply:
    name: 5. Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: terraform-plan

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598907064200:role/GitHubActions-NumberReverser
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform init -input=false

      - name: Terraform apply
        run: |
          terraform apply \
            -auto-approve \
            -input=false


# ============================================================
# 6. DOCKER BUILD AND SECURITY
# ============================================================

  docker-security:
    name: 6. Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - terraform-plan

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t number-reverser:${{ github.sha }} \
            .

      # --------------------------------------------------------
      # Trivy
      # --------------------------------------------------------

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      - name: Scan Docker image
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            number-reverser:${{ github.sha }}

      # --------------------------------------------------------
      # Syft SBOM
      # --------------------------------------------------------

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          syft version

      - name: Generate SBOM
        run: |
          syft number-reverser:${{ github.sha }} \
            -o cyclonedx-json=sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: number-reverser-sbom
          path: sbom.json
          if-no-files-found: error


# ============================================================
# 7. PUSH IMAGE TO GHCR
# ============================================================

  publish-image:
    name: 7. Publish Image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker-security

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t number-reverser:${{ github.sha }} \
            .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker tag \
            number-reverser:${{ github.sha }} \
            ghcr.io/$OWNER/number-reverser:${{ github.sha }}

      - name: Push image to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker push \
            ghcr.io/$OWNER/number-reverser:${{ github.sha }}


# ============================================================
# 8. COSIGN IMAGE SIGNING
# ============================================================

  sign-image:
    name: 8. Sign and Verify Container Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: publish-image

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Verify Cosign installation
        run: |
          cosign version

      - name: Sign container image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          IMAGE="ghcr.io/$OWNER/number-reverser:${{ github.sha }}"

          echo "Signing image:"
          echo "$IMAGE"

          cosign sign --yes "$IMAGE"

      - name: Verify container signature
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          IMAGE="ghcr.io/$OWNER/number-reverser:${{ github.sha }}"

          echo "Verifying image:"
          echo "$IMAGE"

          cosign verify "$IMAGE" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"


# ============================================================
# 9. DEPLOY TO EKS
# ============================================================

  deploy:
    name: 9. Deploy to EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - terraform-apply
      - sign-image

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598907064200:role/GitHubActions-NumberReverser
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name number-reverser \
            --region ap-south-1

      - name: Verify EKS access
        run: |
          kubectl get nodes

      # --------------------------------------------------------
      # Kustomize
      # --------------------------------------------------------

      - name: Install Kustomize
        run: |
          KUSTOMIZE_VERSION=v5.7.1

          curl -sSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kustomize.tar.gz

          tar -xzf /tmp/kustomize.tar.gz -C /tmp

          sudo mv /tmp/kustomize /usr/local/bin/kustomize

          kustomize version

      - name: Update image
        run: |
          cd k8s/overlays/dev

          kustomize edit set image \
            ghcr.io/getglitch/number-reverser=ghcr.io/getglitch/number-reverser:${{ github.sha }}

          echo "===== kustomization.yaml after image update ====="
          cat kustomization.yaml

      - name: Verify rendered image
        run: |
          kubectl kustomize k8s/overlays/dev | grep "image:"

      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - name: Deploy application
        run: |
          kubectl apply -k k8s/overlays/dev

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/number-reverser \
            -n number-reverser-dev \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployments -n number-reverser-dev
          kubectl get pods -n number-reverser-dev
          kubectl get svc -n number-reverser-dev
